<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computing Course</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1c1f28;
    --line: #2e3340;
    --text: #e6e8ee;
    --muted: #9aa1b1;
    --accent: #5b9dff;
    --ok: #3fbf7f;
    --bad: #ef5f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }
  header {
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header a.home { text-decoration: none; color: var(--muted); font-size: 14px; }
  header a.home:hover { color: var(--accent); }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }

  h2 { font-size: 24px; margin: 32px 0 12px; }
  h3 { font-size: 18px; margin: 0 0 16px; color: var(--muted); font-weight: 500; }

  .card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 16px;
    font: inherit;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }

  /* slides */
  .slide {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 30px;
    min-height: 60vh;
  }
  .slide h2 { margin-top: 0; }
  .slide pre {
    background: #0e1017;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.5;
  }
  .slide code { background: #0e1017; padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  .slide pre code { background: none; padding: 0; }
  .slide table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 15px; }
  .slide th, .slide td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .slide th { background: #0e1017; }
  .slide li { margin-bottom: 6px; }

  .navbar { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .navbar .count { color: var(--muted); font-size: 14px; margin-left: auto; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .dot {
    width: 26px; height: 26px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .dot.on { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 700; }

  /* quiz */
  .q { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .q .qtext { font-weight: 600; margin-bottom: 12px; }
  .q label {
    display: block; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 7px; cursor: pointer;
  }
  .q label:hover { border-color: var(--accent); }
  .q input { margin-right: 9px; }
  .graded label { cursor: default; }
  .graded label.correct { border-color: var(--ok); background: rgba(63,191,127,.1); }
  .graded label.wrong { border-color: var(--bad); background: rgba(239,95,95,.1); }
  .score { font-size: 20px; font-weight: 600; margin: 20px 0 4px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <a class="home" href="#/">&#8592; All units</a>
  <h1 id="crumb">Computing Course</h1>
</header>
<main id="app"></main>

<script src="manifest.js"></script>
<script>
const app = document.getElementById('app');
const crumb = document.getElementById('crumb');

// Every file in content/ calls section({...}) once. Its id is its filename.
const SECTIONS = [];
let loading = '';
function section(s) { SECTIONS.push({ ...s, id: loading }); }

// --- routing: #/  |  #/<section-id>/lesson/0  |  #/<section-id>/test ---
function parse() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return { id: p[0], mode: p[1], index: parseInt(p[2] || '0', 10) };
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render() {
  const r = parse();
  const section = SECTIONS.find(s => s.id === r.id);
  if (!section) return home();
  if (r.mode === 'test') return test(section);
  return lesson(section, isNaN(r.index) ? 0 : r.index);
}

function home() {
  crumb.textContent = 'Computing Course';
  const units = [];
  for (const s of SECTIONS) {
    let u = units.find(u => u.title === s.unit);
    if (!u) units.push(u = { title: s.unit, sections: [] });
    u.sections.push(s);
  }
  app.innerHTML = units.map(u => `
    <h2>${esc(u.title)}</h2>
    ${u.sections.map(s => `
      <div class="card">
        <div><b>${esc(s.title)}</b></div>
        <div class="meta">${s.slides.length} slides &middot; ${s.questions.length} questions</div>
        <div class="row">
          <a class="btn primary" href="#/${s.id}/lesson/0">Lesson</a>
          <a class="btn" href="#/${s.id}/test">Test</a>
        </div>
      </div>`).join('')}
  `).join('');
}

function lesson(section, i) {
  const n = section.slides.length;
  i = Math.max(0, Math.min(i, n - 1));
  const slide = section.slides[i];
  crumb.textContent = section.unit + ' — ' + section.title;
  const last = i === n - 1;
  app.innerHTML = `
    <h3>${esc(section.title)}</h3>
    <div class="slide">
      <h2>${slide.title}</h2>
      ${slide.body}
    </div>
    <div class="navbar">
      <button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>&#8592; Back</button>
      ${last
        ? `<a class="btn primary" href="#/${section.id}/test">Take the test &#8594;</a>`
        : `<button class="btn primary" id="next">Next &#8594;</button>`}
      <span class="count">Slide ${i + 1} of ${n}</span>
    </div>
    <div class="dots">
      ${section.slides.map((_, k) =>
        `<button class="dot ${k === i ? 'on' : ''}" data-i="${k}">${k + 1}</button>`).join('')}
    </div>`;

  const go = k => { location.hash = `#/${section.id}/lesson/${k}`; };
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  if (prev) prev.onclick = () => go(i - 1);
  if (next) next.onclick = () => go(i + 1);
  app.querySelectorAll('.dot').forEach(d => d.onclick = () => go(+d.dataset.i));

  document.onkeydown = e => {
    if (e.key === 'ArrowRight' && !last) go(i + 1);
    if (e.key === 'ArrowLeft' && i > 0) go(i - 1);
  };
  window.scrollTo(0, 0);
}

function test(section) {
  const qs = section.questions;
  crumb.textContent = section.unit + ' — ' + section.title + ' — Test';
  document.onkeydown = null;
  app.innerHTML = `
    <h3>${esc(section.title)} &mdash; Test</h3>
    <p class="muted">${qs.length} multiple choice questions. Pick one answer each, then submit.</p>
    <form id="quiz">
      ${qs.map((q, i) => `
        <div class="q" data-i="${i}">
          <div class="qtext">${i + 1}. ${esc(q.q)}</div>
          ${q.choices.map((c, j) => `
            <label data-j="${j}">
              <input type="radio" name="q${i}" value="${j}">${esc(c)}
            </label>`).join('')}
        </div>`).join('')}
      <div class="row">
        <button type="submit" class="btn primary">Submit answers</button>
        <a class="btn" href="#/${section.id}/lesson/0">Review lesson</a>
      </div>
    </form>
    <div id="result"></div>`;

  document.getElementById('quiz').onsubmit = e => {
    e.preventDefault();
    const form = e.target;
    let score = 0, unanswered = 0;
    qs.forEach((q, i) => {
      const picked = form[`q${i}`].value;
      if (picked === '') unanswered++;
      const box = app.querySelector(`.q[data-i="${i}"]`);
      box.classList.add('graded');
      box.querySelectorAll('label').forEach(l => {
        const j = +l.dataset.j;
        l.querySelector('input').disabled = true;
        if (j === q.answer) l.classList.add('correct');
        else if (String(j) === picked) l.classList.add('wrong');
      });
      if (+picked === q.answer) score++;
    });
    const pct = Math.round(score / qs.length * 100);
    document.getElementById('result').innerHTML = `
      <div class="score">${score} / ${qs.length} &mdash; ${pct}%${pct >= 80 ? ' ✓ Pass' : ''}</div>
      <p class="muted">${unanswered ? unanswered + ' left blank. ' : ''}Green marks the correct answer, red marks your incorrect pick.</p>
      <div class="row">
        <button class="btn" onclick="render()">Retake</button>
        <a class="btn" href="#/">Back to units</a>
      </div>`;
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
  };
  window.scrollTo(0, 0);
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(src));
    document.head.appendChild(el);
  });
}

(async () => {
  try {
    for (const file of MANIFEST) {
      loading = file.replace(/\.js$/, '');
      await loadScript('content/' + file);
    }
  } catch (e) {
    app.innerHTML = `<p class="muted">Could not load <code>${esc(e.message)}</code>.
      It is listed in manifest.js but missing or broken — run <code>node build.js</code>.</p>`;
    return;
  }
  window.onhashchange = render;
  render();
})();
</script>
</body>
</html>
